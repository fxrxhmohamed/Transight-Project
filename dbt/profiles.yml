# The pipeline's database, from the same POSTGRES_* variables as every
# other step (semantic.py sets them from METAFLOW_DB_URL when given).

transight:
  target: default
  outputs:
    default:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      dbname: "{{ env_var('POSTGRES_DB', 'metaflow') }}"
      user: "{{ env_var('POSTGRES_USER', 'metaflow') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'change_me_local_only') }}"
      schema: semantic
      threads: 4
