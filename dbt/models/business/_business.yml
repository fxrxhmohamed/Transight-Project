version: 2

models:
  - name: fct_transactions
    description: Transactions of gold.fact_transaction (view; amounts in EGP).
    columns:
      - name: transaction_id
        data_tests: [unique, not_null]
  - name: dim_banks
    description: Banks of gold.dim_bank (view).
  - name: dim_branches
    description: Branches of gold.dim_branch (view).
  - name: dim_customers
    description: Descriptive customer attributes of gold.dim_customer (view, no personal data).
  - name: transaction_monthly
    description: >
      Transactions per month, bank, channel, type and status (table, for
      Power BI). customers counts distinct customers within a row: do not
      add it up across rows.

# Business metrics for MetricFlow, e.g. (inside dbt/):
#   mf query --metrics transaction_amount_egp,failure_rate --group-by metric_time__month,bank__bank_name
#   mf query --metrics active_customers --group-by customer__customer_segment

semantic_models:
  - name: transactions
    description: One row per transaction.
    model: ref('fct_transactions')
    defaults:
      agg_time_dimension: transaction_date
    entities:
      - name: transaction
        type: primary
        expr: transaction_id
      - name: customer
        type: foreign
        expr: customer_id
      - name: branch
        type: foreign
        expr: branch_id
      - name: bank
        type: foreign
        expr: bank_id
    dimensions:
      - name: transaction_date
        type: time
        type_params:
          time_granularity: day
      - name: transaction_type
        type: categorical
      - name: transaction_status
        type: categorical
      - name: channel
        type: categorical
      - name: digital_channel_flag
        type: categorical
      - name: currency
        type: categorical
    measures:
      - name: transaction_count
        agg: count
        expr: transaction_id
      - name: amount_egp
        agg: sum
      - name: channel_cost_egp
        agg: sum
        expr: estimated_channel_cost_egp
      - name: customers_transacting
        agg: count_distinct
        expr: customer_id
      - name: digital_migration_opportunities
        agg: sum
        expr: "case when digital_migration_opportunity then 1 else 0 end"

  - name: banks
    model: ref('dim_banks')
    entities:
      - name: bank
        type: primary
        expr: bank_id
    dimensions:
      - name: bank_name
        type: categorical
      - name: bank_type
        type: categorical

  - name: branches
    model: ref('dim_branches')
    entities:
      - name: branch
        type: primary
        expr: branch_id
    dimensions:
      - name: branch_name
        type: categorical
      - name: branch_city
        type: categorical
      - name: branch_governorate
        type: categorical
      - name: branch_region
        type: categorical

  - name: customers
    model: ref('dim_customers')
    entities:
      - name: customer
        type: primary
        expr: customer_id
    dimensions:
      - name: gender
        type: categorical
      - name: marital_status
        type: categorical
      - name: customer_governorate
        type: categorical
      - name: customer_segment
        type: categorical
      - name: occupation
        type: categorical

metrics:
  - name: transactions
    label: Transactions
    type: simple
    type_params:
      measure: transaction_count

  - name: transaction_amount_egp
    label: Transaction amount (EGP)
    type: simple
    type_params:
      measure: amount_egp

  - name: average_transaction_egp
    label: Average transaction (EGP)
    type: ratio
    type_params:
      numerator: transaction_amount_egp
      denominator: transactions

  - name: failed_transactions
    label: Failed transactions
    type: simple
    type_params:
      measure: transaction_count
    filter: "{{ Dimension('transaction__transaction_status') }} = 'Failed'"

  - name: failure_rate
    label: Failure rate
    type: ratio
    type_params:
      numerator: failed_transactions
      denominator: transactions

  - name: digital_transactions
    label: Digital transactions
    type: simple
    type_params:
      measure: transaction_count
    filter: "{{ Dimension('transaction__digital_channel_flag') }} = true"

  - name: digital_share
    label: Digital share
    description: Share of transactions made on a digital channel.
    type: ratio
    type_params:
      numerator: digital_transactions
      denominator: transactions

  - name: channel_cost_egp
    label: Channel cost (EGP)
    type: simple
    type_params:
      measure: channel_cost_egp

  - name: cost_per_transaction_egp
    label: Channel cost per transaction (EGP)
    type: ratio
    type_params:
      numerator: channel_cost_egp
      denominator: transactions

  - name: active_customers
    label: Active customers
    description: Distinct customers with at least one transaction.
    type: simple
    type_params:
      measure: customers_transacting

  - name: digital_migration_opportunities
    label: Digital migration opportunities
    type: simple
    type_params:
      measure: digital_migration_opportunities
