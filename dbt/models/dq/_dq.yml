version: 2

# The DQ tables of the semantic layer: what the DQ engine recorded,
# reshaped per run, round, rule, record and correction. Tables in the
# semantic schema, rebuilt by "python dq.py metrics" (dbt build --select
# models/dq) after every validation, correction round and merge; the DQ
# metrics (_metrics.yml) are computed from them. Their tests are the checks
# the step makes: a failing error test fails the step.

models:
  - name: dq_run
    description: >
      One row per run and round: record counts and DQ scores. Counts after
      round 1 are running totals; is_latest_round marks the run's current
      figures.
    data_tests:
      - unique_columns:
          arguments:
            columns: [dataset, run_id, round]
      - expression_holds:
          arguments:
            expression: resolved + discarded + unresolved_records = quarantined
    columns:
      - name: run_id
        data_tests: [not_null]
      - name: dataset
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
      - name: processed
        description: Rows validated (input minus exact duplicates).
      - name: valid
        description: Accepted on the first validation.
      - name: auto_fixed_records
        description: Valid records that needed at least one automatic repair.
      - name: quarantined
        description: Failed the first validation.
      - name: records_with_issues
        description: auto_fixed_records + quarantined.
      - name: initial_dq_score
        description: valid / processed.
      - name: resolved
        description: Quarantined records RESOLVED so far.
      - name: manually_fixed_records
        description: Quarantined, corrected by hand (FIX) and RESOLVED.
      - name: confirmed_records
        description: >
          Held because of many automatic repairs, accepted as they were by a
          person (ACCEPT) and RESOLVED.
      - name: auto_resolved_records
        description: >
          RESOLVED without a manual fix or confirmation (re-validated with
          --all, e.g. after a rule change).
      - name: discarded
        description: Discarded by a person or removed as a duplicate.
      - name: unresolved_records
        description: Still OPEN or MANUAL_REVIEW_REQUIRED.
      - name: final_dq_score
        description: (valid + resolved) / processed.
      - name: is_latest_round
        description: The run's most recent round (its current figures).

  - name: dq_rule_result
    description: >
      One row per run, round and rule: checked, failed, repaired and
      unresolved values. Re-validation rounds count the corrected records
      only.
    data_tests:
      - unique_columns:
          arguments:
            columns: [dataset, run_id, round, rule_id]
    columns:
      - name: rule_id
        data_tests: [not_null]
      - name: dimension
        description: DQ dimension (validity, completeness, consistency, ...).

  - name: dq_quarantine
    description: Every status change of every quarantined record, numbered per record.
    columns:
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [OPEN, RESOLVED, MANUAL_REVIEW_REQUIRED, DISCARDED]

  - name: dq_correction
    description: >
      Every automatic repair (remediation audit) and manual correction
      (correction log), with its outcome.
    columns:
      - name: correction_type
        data_tests:
          - accepted_values:
              arguments:
                values: [automatic, manual]
      - name: outcome
        description: >
          An outcome not listed here may need a look at dq_run's auto-fixed
          count (it counts remediated and nullified_in_accepted only).
        data_tests:
          - accepted_values:
              arguments:
                values: [remediated, not_fixed, nullified_in_accepted, superseded,
                         resolved, failed_revalidation, manual_review_required,
                         discarded, pending]
              config:
                severity: warn
