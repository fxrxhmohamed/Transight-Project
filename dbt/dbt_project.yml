# Metric tables for Power BI and the MetricFlow semantic layer.
#
#   models/dq/        metrics.dq_run, dq_rule_result, dq_quarantine,
#                     dq_correction, from the dq schema    (tag: dq)
#   models/business/  marts.*, from the gold star schema   (tag: gold)
#   models/semantic/  the time spine MetricFlow needs
#
# Run through dq.py ("python dq.py metrics" builds tag:dq; "python dq.py
# gold" builds tag:gold after the star schema), or directly:
#
#   dbt build --project-dir dbt --profiles-dir dbt
#   mf query --metrics dq_final_score --group-by run__dataset   (inside dbt/)

name: metaflow
version: "1.0.0"
config-version: 2
profile: metaflow

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "logs"]

models:
  metaflow:
    staging:
      +materialized: ephemeral
    dq:
      +materialized: table
      +schema: metrics
      +tags: ["dq"]
    business:
      +schema: marts
      +tags: ["gold"]
    semantic:
      +materialized: table
      +schema: marts
      +tags: ["dq", "gold"]

data_tests:
  metaflow:
    +severity: error
