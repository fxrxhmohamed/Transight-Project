name: data-quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The pipeline's database; the tests create and drop their own database
    # in it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: metaflow
          POSTGRES_USER: metaflow
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metaflow -d metaflow"
          --health-interval 5s --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: metaflow
      POSTGRES_USER: metaflow
      POSTGRES_PASSWORD: ci_only
      # Spark in local mode; the JDBC driver is fetched from Maven.
      SPARK_DRIVER_MEMORY: 4g

    steps:
      - uses: actions/checkout@v4

      # Spark needs Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/*/requirements.txt

      - name: Install
        run: |
          python -m pip install -r services/ingestion-service/requirements.txt \
                                -r services/metadata-service/requirements.txt \
                                -r services/dq-service/requirements.txt \
                                pytest

      # 50-row test dataset with one example of each defect, run through
      # every step of dq.py (tests/test_pipeline.py).
      - name: Test the data-quality flow
        run: python -m pytest tests -v
